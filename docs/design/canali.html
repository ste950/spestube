<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpesTube: Canali e filtri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
html{background:#D9DCE3}
body{display:flex;justify-content:center;padding:24px 0}
a{color:#2557C7}a:hover{color:#1A3F94}
</style>
</head>
<body>
<div style="width: 390px; height: 1080px; box-sizing: border-box; background: #F3F4F7; color: #15181F; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

<div style="flex: 1 1 auto; padding: 28px 16px 16px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
<header style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 600; letter-spacing: -0.6px">Canali e filtri</h1>
<span style="font-size: 15px; color: #4A5160">Le regole le decidi tu.</span>
</header>

<section style="background: #FFFFFF; border: 1px solid #DCE0E8; border-radius: 14px; padding: 6px 16px 14px; display: flex; flex-direction: column">
<label style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ECEEF2; font-size: 15px">Escludi Shorts <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2557C7"></label>
<label style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ECEEF2; font-size: 15px">Escludi dirette e Premiere <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2557C7"></label>
<label style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ECEEF2; font-size: 15px">Nascondi visualizzazioni e like <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2557C7"></label>
<label style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ECEEF2; font-size: 15px">Durata minima
<select style="min-height: 36px; border: 1px solid #C5CBD6; border-radius: 8px; padding: 0 8px; font-family: Inter, system-ui, sans-serif; font-size: 14px; background: #FFFFFF; color: #15181F">
<option>Nessuna</option>
<option selected>5 minuti</option>
<option>10 minuti</option>
</select>
</label>
<label style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ECEEF2; font-size: 15px">Arrivo nuovi video
<select style="min-height: 36px; border: 1px solid #C5CBD6; border-radius: 8px; padding: 0 8px; font-family: Inter, system-ui, sans-serif; font-size: 14px; background: #FFFFFF; color: #15181F">
<option selected>Ogni giorno, 7:00</option>
<option>Ogni giorno, 19:00</option>
<option>Una volta a settimana</option>
</select>
</label>
<fieldset style="border: 0; margin: 0; padding: 12px 0 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; font-size: 15px; float: left; margin-bottom: 10px">Miniature</legend>
<div style="clear: both; display: flex; gap: 6px; background: #EEF0F4; border-radius: 10px; padding: 4px">
<label style="flex: 1 1 0; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; font-size: 13px; color: #4A5160"><input type="radio" name="mini" style="accent-color: #2557C7; margin: 0"> Nascoste</label>
<label style="flex: 1 1 0; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #15181F"><input type="radio" name="mini" checked style="accent-color: #2557C7; margin: 0"> In B/N</label>
<label style="flex: 1 1 0; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; font-size: 13px; color: #4A5160"><input type="radio" name="mini" style="accent-color: #2557C7; margin: 0"> Normali</label>
</div>
</fieldset>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCE0E8; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<label for="regola" style="font-size: 15px; font-weight: 600">Filtro intelligente</label>
<span style="font-size: 12px; color: #5A6170">opzionale</span>
</div>
<textarea id="regola" style="height: 84px; resize: none; box-sizing: border-box; border: 1px solid #C5CBD6; border-radius: 10px; padding: 10px 12px; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #15181F; background: #FFFFFF">Tieni approfondimenti e tutorial. Scarta reaction, drama e video che sono solo pubblicità.</textarea>
<span style="font-size: 12px; line-height: 1.4; color: #5A6170">Titoli e descrizioni passano dal tuo gateway LLM prima di arrivare in Oggi.</span>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">I tuoi canali</h2>
<span style="font-size: 13px; color: #5A6170">4</span>
</div>
<div style="background: #FFFFFF; border: 1px solid #DCE0E8; border-radius: 14px; padding: 0 6px 0 16px; display: flex; flex-direction: column">
<div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ECEEF2; font-size: 15px">Officina Radio
<button type="button" aria-label="Rimuovi Officina Radio" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5A6170; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
</div>
<div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ECEEF2; font-size: 15px">Storia in Chiaro
<button type="button" aria-label="Rimuovi Storia in Chiaro" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5A6170; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
</div>
<div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ECEEF2; font-size: 15px">Cucina Lenta
<button type="button" aria-label="Rimuovi Cucina Lenta" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5A6170; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
</div>
<div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-size: 15px">Codice Sobrio
<button type="button" aria-label="Rimuovi Codice Sobrio" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5A6170; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nuovo" style="font-size: 14px; font-weight: 600; padding: 0 4px">Aggiungi canale</label>
<div style="display: flex; gap: 8px">
<input id="nuovo" type="text" placeholder="@handle o link del canale" style="flex: 1 1 auto; min-width: 0; min-height: 46px; box-sizing: border-box; border: 1px solid #C5CBD6; border-radius: 10px; padding: 0 12px; font-family: Inter, system-ui, sans-serif; font-size: 15px; background: #FFFFFF; color: #15181F">
<button type="button" style="flex: 0 0 auto; min-height: 46px; padding: 0 16px; border: 0; border-radius: 10px; background: #2557C7; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Aggiungi</button>
</div>
<a href="canali.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; padding: 0 4px; font-size: 14px; font-weight: 500">Importa le iscrizioni da Google Takeout</a>
</div>
</section>
</div>

<nav aria-label="Sezioni" style="flex: 0 0 auto; display: flex; justify-content: space-around; background: #FFFFFF; border-top: 1px solid #DCE0E8; padding: 8px 8px 22px">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4"></path><path d="M4 13l2-8h12l2 8v6H4z"></path></svg>
Oggi
</a>
<a href="da-vedere.html" style="min-width: 88px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6170; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"></path></svg>

</a>
<a href="canali.html" aria-current="page" style="min-width: 88px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #2557C7; font-size: 12px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h10"></path></svg>

</nav>

</div>
</body>
</html>
